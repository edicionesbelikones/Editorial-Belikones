<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cyberpunk Portal // Editorial Belikones</title>
  
  <!-- Fuente Cyberpunk desde Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">

  <style>
    /* VARIABLES DE COLOR CYBERPUNK */
    :root {
      --bg-color: #0d0e15;
      --card-bg: rgba(20, 24, 35, 0.85);
      --neon-cyan: #00f3ff;
      --neon-pink: #ff0055;
      --neon-yellow: #fcee0a;
      --text-main: #e0e6ed;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: 'Share Tech Mono', monospace;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
    }

    /* EFECTO DE LÍNEAS DE ESCANEO (SCANLINES) */
    body::before {
      content: "";
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(
        rgba(18, 16, 16, 0) 50%, 
        rgba(0, 0, 0, 0.25) 50%
      );
      background-size: 100% 4px;
      z-index: 2;
      pointer-events: none;
    }

    /* GLOW DE FONDO */
    .glow-bg {
      position: absolute;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(0,243,255,0.15) 0%, rgba(0,0,0,0) 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 1;
    }

    /* CONTENEDOR PRINCIPAL */
    .container {
      position: relative;
      z-index: 3;
      background: var(--card-bg);
      border: 2px solid var(--neon-cyan);
      box-shadow: 0 0 15px rgba(0, 243, 255, 0.3), inset 0 0 15px rgba(0, 243, 255, 0.1);
      padding: 3rem 2rem;
      border-radius: 4px;
      max-width: 500px;
      width: 90%;
      text-align: center;
      clip-path: polygon(0 0, 95% 0, 100% 5%, 100% 100%, 5% 100%, 0 95%);
    }

    /* ETIQUETA TIPO TERMINAL */
    .sys-status {
      font-size: 0.8rem;
      color: var(--neon-yellow);
      letter-spacing: 2px;
      margin-bottom: 1.5rem;
      text-transform: uppercase;
    }

    /* TÍTULO PRINCIPAL */
    h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 2.2rem;
      font-weight: 900;
      color: #fff;
      text-transform: uppercase;
      letter-spacing: 3px;
      text-shadow: 2px 2px var(--neon-pink), -2px -2px var(--neon-cyan);
      margin-bottom: 1rem;
    }

    p {
      color: #a0aab5;
      font-size: 1rem;
      margin-bottom: 2.5rem;
      line-height: 1.4;
    }

    /* BOTÓN CYBERPUNK CON TU ENLACE REAL */
    .cyber-button {
      display: inline-block;
      width: 100%;
      padding: 1.2rem;
      font-family: 'Orbitron', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      color: #000;
      background-color: var(--neon-cyan);
      text-decoration: none;
      text-transform: uppercase;
      letter-spacing: 2px;
      position: relative;
      transition: all 0.2s ease;
      clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
      box-shadow: 0 0 20px rgba(0, 243, 255, 0.6);
    }

    .cyber-button:hover {
      background-color: var(--neon-pink);
      color: #fff;
      box-shadow: 0 0 25px rgba(255, 0, 85, 0.8);
      transform: scale(1.02);
    }

    .cyber-button:active {
      transform: scale(0.98);
    }

    /* DECORACIÓN */
    .corner-tag {
      position: absolute;
      bottom: 8px;
      right: 12px;
      font-size: 0.65rem;
      color: var(--neon-cyan);
      opacity: 0.7;
    }
  </style>
</head>
<body>

  <div class="glow-bg"></div>

  <div class="container">
    <div class="sys-status">[ SYSTEM // ONLINE ]</div>
    
    <h1>EDITORIAL<br/>BELIKONES</h1>
    
    <p>Acceso directo al portal oficial de Editorial Belikones.</p>
    
    <!-- TU ENLACE REAL DE GITHUB PAGES -->
    <a href="https://edicionesbelikones.github.io/Editorial-Belikones/" class="cyber-button">
      // ACCEDER AL SITIO
    </a>

    <div class="corner-tag">SEC_LEVEL_01</div>
  </div>

</body>
</html>
