<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ediciones Belikones - Convocatoria</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <!-- Overlay Loader de subida -->
  <div id="uploadOverlay" class="upload-overlay">
    <div class="loader-container">
      <div class="bullet-loader"></div>
      <p>Subiendo manuscrito... <span id="uploadProgressText">0%</span></p>
    </div>
  </div>

  <div id="mainContainer">
    <!-- Navegación -->
    <header>
      <button id="navToggle" aria-expanded="false" aria-label="Abrir menú">
        <i class="fa-solid fa-bars"></i>
      </button>
      <nav id="navMenu">
        <ul>
          <li><a href="#inicio">Inicio</a></li>
          <li><a href="#convocatoria">Convocatoria</a></li>
          <li><a href="#envio">Enviar Proyecto</a></li>
        </ul>
      </nav>

      <!-- Buscador -->
      <form id="searchForm" role="search">
        <input type="search" id="searchInput" placeholder="Buscar en el sitio..." aria-label="Buscar">
        <button type="submit"><i class="fa-solid fa-magnifying-glass"></i></button>
      </form>
      <div id="searchNavControls" class="search-controls">
        <button id="prevMatchBtn" type="button"><i class="fa-solid fa-chevron-up"></i></button>
        <button id="nextMatchBtn" type="button"><i class="fa-solid fa-chevron-down"></i></button>
        <span id="searchCounter">0/0</span>
      </div>
      <div id="searchMessage"></div>
    </header>

    <!-- Sección de Envíos y Formulario -->
    <div class="container">
      <section id="envio" class="form-section">
        <h2>Envía tu Proyecto</h2>
        <form id="manuscriptForm" action="https://formspree.io/f/tu-endpoint" method="POST" enctype="multipart/form-data">
          
          <div class="form-group">
            <label for="name">Nombre completo o seudónimo *</label>
            <input type="text" id="name" name="Nombre" placeholder="Tu nombre o seudónimo" required>
          </div>

          <div class="form-group">
            <label for="email">Correo electrónico de contacto *</label>
            <input type="email" id="email" name="Email" placeholder="tu@email.com" autocomplete="email" required>
          </div>

          <div class="form-group">
            <label for="title">Título del proyecto / manuscrito *</label>
            <input type="text" id="title" name="Título del proyecto" placeholder="Título de la obra o proyecto" required>
          </div>

          <div class="form-group">
            <label for="type">Tipo de proyecto *</label>
            <select id="type" name="Tipo de proyecto" required>
              <option value="" disabled selected>Selecciona una opción</option>
              <option value="Narrativa">Narrativa (cuento, novela, etc.)</option>
              <option value="Poesía">Poesía</option>
              <option value="Ensayo">Ensayo / Crítica</option>
              <option value="Visual">Proyecto visual / Ilustración</option>
              <option value="Sonoro">Proyecto sonoro / Audio</option>
              <option value="Multiformato">Multiformato / Híbrido</option>
              <option value="IA">Asistido o generado con IA</option>
              <option value="Otro">Otro</option>
            </select>
          </div>

          <div class="form-group">
            <label for="description">Descripción o sinopsis del proyecto *</label>
            <textarea id="description" name="Descripción / Sinopsis" rows="6" placeholder="Cuéntanos brevemente de qué trata tu proyecto, su extensión aproximada y cualquier detalle relevante..." required></textarea>
          </div>

          <!-- Subida de manuscritos -->
          <div class="form-group">
            <label for="manuscript">Subir manuscrito / archivos *</label>
            <input type="file" id="manuscript" name="Archivo(s)" multiple accept=".pdf,.doc,.docx,.txt,.epub,.zip,.jpg,.jpeg,.png,.mp3,.mp4,.wav" required>
            <small>Puedes subir varios archivos (PDF, Word, ZIP, imágenes, audio o video). Tamaño máximo recomendado: 20 MB por archivo.</small>
          </div>

          <div class="form-group">
            <label for="notes">Notas adicionales (opcional)</label>
            <textarea id="notes" name="Notas adicionales" rows="3" placeholder="Cualquier información extra que quieras compartir con el equipo editorial..."></textarea>
          </div>

          <button type="submit" class="submit-btn">
            <i class="fa-solid fa-paper-plane"></i> Enviar proyecto
          </button>
        </form>
      </section>
    </div>

    <footer>
      <p>© 2026 Ediciones Belikones. Todos los derechos reservados.</p>
    </footer>
  </div>

  <script>
    // ========== MENÚ MÓVIL ==========
    const navToggle = document.getElementById('navToggle');
    const navMenu = document.getElementById('navMenu');

    if (navToggle && navMenu) {
      navToggle.addEventListener('click', () => {
        const isOpen = navMenu.classList.toggle('active');
        navToggle.setAttribute('aria-expanded', isOpen);
      });
    }

    // ========== BUSCADOR CON RESALTADO ==========
    (function () {
      const searchInput = document.getElementById('searchInput');
      const searchForm = document.getElementById('searchForm');
      const searchMessage = document.getElementById('searchMessage');
      const searchNavControls = document.getElementById('searchNavControls');
      const searchCounter = document.getElementById('searchCounter');
      const prevBtn = document.getElementById('prevMatchBtn');
      const nextBtn = document.getElementById('nextMatchBtn');
      const mainContainer = document.getElementById('mainContainer');

      let matches = [];
      let currentIndex = -1;

      function isSkippable(node) {
        const parent = node.parentNode;
        if (!parent) return true;
        const tag = parent.tagName ? parent.tagName.toLowerCase() : '';
        return ['script', 'style', 'noscript', 'textarea', 'input', 'button', 'select'].includes(tag) ||
               parent.classList.contains('highlight-yellow');
      }

      function clearHighlights() {
        const highlights = document.querySelectorAll('.highlight-yellow');
        highlights.forEach(span => {
          const parent = span.parentNode;
          parent.replaceChild(document.createTextNode(span.textContent), span);
          parent.normalize();
        });
        matches = [];
        currentIndex = -1;
        searchNavControls.classList.remove('active');
        searchCounter.textContent = '0/0';
        searchMessage.textContent = '';
        searchMessage.classList.remove('no-results-glow');
        searchInput.classList.remove('no-results-glow');
      }

      function highlightMatches(term) {
        clearHighlights();
        if (!term || term.length < 2) return;

        const walker = document.createTreeWalker(
          mainContainer,
          NodeFilter.SHOW_TEXT,
          {
            acceptNode: function (node) {
              if (isSkippable(node) || !node.nodeValue.trim()) {
                return NodeFilter.FILTER_REJECT;
              }
              return NodeFilter.FILTER_ACCEPT;
            }
          }
        );

        const textNodes = [];
        let node;
        while ((node = walker.nextNode())) {
          textNodes.push(node);
        }

        const regex = new RegExp(term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');

        textNodes.forEach(textNode => {
          const text = textNode.nodeValue;
          if (!regex.test(text)) return;

          const frag = document.createDocumentFragment();
          let lastIndex = 0;
          let match;

          regex.lastIndex = 0;
          while ((match = regex.exec(text)) !== null) {
            if (match.index > lastIndex) {
              frag.appendChild(document.createTextNode(text.slice(lastIndex, match.index)));
            }

            const span = document.createElement('span');
            span.className = 'highlight-yellow';
            span.textContent = match[0];
            frag.appendChild(span);
            matches.push(span);

            lastIndex = regex.lastIndex;
          }

          if (lastIndex < text.length) {
            frag.appendChild(document.createTextNode(text.slice(lastIndex)));
          }

          textNode.parentNode.replaceChild(frag, textNode);
        });

        if (matches.length > 0) {
          currentIndex = 0;
          updateActiveMatch();
          searchNavControls.classList.add('active');
          searchCounter.textContent = `1/${matches.length}`;
          searchMessage.textContent = '';
          searchMessage.classList.remove('no-results-glow');
          searchInput.classList.remove('no-results-glow');
        } else {
          searchMessage.textContent = 'No hay resultados';
          searchMessage.style.color = '#ff0055';
          searchMessage.classList.add('no-results-glow');
          searchInput.classList.add('no-results-glow');
          searchNavControls.classList.remove('active');
        }
      }

      function updateActiveMatch() {
        matches.forEach((m, i) => {
          m.classList.toggle('active-match', i === currentIndex);
        });
        if (matches[currentIndex]) {
          matches[currentIndex].scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
        searchCounter.textContent = `${currentIndex + 1}/${matches.length}`;
      }

      function goToNext() {
        if (matches.length === 0) return;
        currentIndex = (currentIndex + 1) % matches.length;
        updateActiveMatch();
      }

      function goToPrev() {
        if (matches.length === 0) return;
        currentIndex = (currentIndex - 1 + matches.length) % matches.length;
        updateActiveMatch();
      }

      searchForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const term = searchInput.value.trim();
        highlightMatches(term);
      });

      let debounceTimer;
      searchInput.addEventListener('input', () => {
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(() => {
          const term = searchInput.value.trim();
          if (term.length >= 2) {
            highlightMatches(term);
          } else {
            clearHighlights();
          }
        }, 300);
      });

      nextBtn.addEventListener('click', goToNext);
      prevBtn.addEventListener('click', goToPrev);

      searchInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          highlightMatches(searchInput.value.trim());
        }
        if (e.key === 'ArrowDown' || e.key === 'ArrowRight') {
          e.preventDefault();
          goToNext();
        }
        if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') {
          e.preventDefault();
          goToPrev();
        }
      });
    })();

    // ========== LOADER DE SUBIDA CON BALA AK-47 ==========
    (function () {
      const form = document.getElementById('manuscriptForm');
      const overlay = document.getElementById('uploadOverlay');
      const progressText = document.getElementById('uploadProgressText');

      if (!form || !overlay) return;

      form.addEventListener('submit', function (e) {
        e.preventDefault();

        if (!form.checkValidity()) {
          form.reportValidity();
          return;
        }

        overlay.classList.add('active');
        progressText.textContent = '0%';

        const formData = new FormData(form);
        const xhr = new XMLHttpRequest();

        xhr.open('POST', form.action, true);

        xhr.upload.onprogress = function (event) {
          if (event.lengthComputable) {
            const percent = Math.round((event.loaded / event.total) * 100);
            progressText.textContent = percent + '%';
          }
        };

        xhr.onload = function () {
          if (xhr.status >= 200 && xhr.status < 300) {
            progressText.textContent = '100%';
            setTimeout(() => {
              window.location.href = 'https://edicionesbelikones.github.io/Editorial-Belikones/gracias.html';
            }, 600);
          } else {
            overlay.classList.remove('active');
            alert('Hubo un problema al enviar el formulario. Intenta de nuevo.');
          }
        };

        xhr.onerror = function () {
          overlay.classList.remove('active');
          alert('Error de conexión. Verifica tu internet e intenta nuevamente.');
        };

        xhr.send(formData);
      });
    })();
  </script>
</body>
</html>
