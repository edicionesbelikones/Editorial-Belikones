<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ediciones Belikones - Envío de Manuscritos</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-color: #0d0d0d;
      --card-bg: #171717;
      --accent-color: #ff0055;
      --text-color: #e0e0e0;
      --text-muted: #a0a0a0;
      --border-color: #2a2a2a;
      --input-bg: #222222;
    }
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      line-height: 1.6;
      padding: 20px;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      background: var(--card-bg);
      border-radius: 12px;
      border: 1px solid var(--border-color);
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      overflow: hidden;
    }

    header {
      padding: 30px 20px;
      text-align: center;
      border-bottom: 1px solid var(--border-color);
      background: linear-gradient(180deg, #1f1f1f 0%, #171717 100%);
    }

    header h1 {
      font-size: 2.2rem;
      letter-spacing: 2px;
      color: #fff;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    header p {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    /* Search Bar Styles */
    .search-section {
      padding: 20px;
      border-bottom: 1px solid var(--border-color);
      background: #121212;
    }

    .search-box {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .search-box input {
      flex: 1;
      padding: 10px 14px;
      background: var(--input-bg);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: #fff;
      font-size: 0.95rem;
    }

    .search-box input:focus {
      outline: none;
      border-color: var(--accent-color);
    }

    .search-btn {
      padding: 10px 16px;
      background: var(--border-color);
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .search-btn:hover {
      background: #333;
    }

    .search-controls {
      display: none;
      align-items: center;
      gap: 10px;
      margin-top: 10px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .search-controls.active {
      display: flex;
    }

    .search-nav-btn {
      background: var(--input-bg);
      border: 1px solid var(--border-color);
      color: #fff;
      padding: 4px 8px;
      border-radius: 4px;
      cursor: pointer;
    }

    .highlight-yellow {
      background-color: #ffd700;
      color: #000;
      font-weight: bold;
      border-radius: 2px;
    }

    .highlight-yellow.active-match {
      background-color: #ff0055;
      color: #fff;
    }

    .no-results-glow {
      border-color: var(--accent-color) !important;
      box-shadow: 0 0 8px rgba(255, 0, 85, 0.4);
    }

    /* Form Styles */
    .form-section {
      padding: 30px 20px;
    }

    .form-group {
      margin-bottom: 22px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      font-size: 0.95rem;
      color: #ddd;
    }

    input[type="text"],
    input[type="email"],
    select,
    textarea {
      width: 100%;
      padding: 12px 14px;
      background: var(--input-bg);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: #fff;
      font-size: 0.95rem;
      font-family: inherit;
    }

    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--accent-color);
    }

    small {
      display: block;
      margin-top: 6px;
      color: var(--text-muted);
      font-size: 0.82rem;
    }

    .submit-btn {
      width: 100%;
      padding: 14px;
      background: var(--accent-color);
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: opacity 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .submit-btn:hover {
      opacity: 0.9;
    }

    /* Upload Overlay */
    .upload-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.85);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .upload-overlay.active {
      display: flex;
    }

    .loader-box {
      text-align: center;
      color: #fff;
    }

    .progress-text {
      font-size: 2rem;
      font-weight: bold;
      color: var(--accent-color);
      margin-top: 15px;
    }

    footer {
      padding: 20px;
      text-align: center;
      font-size: 0.85rem;
      color: var(--text-muted);
      border-top: 1px solid var(--border-color);
      background: #121212;
    }
  </style>
</head>
<body>

  <!-- Overlay de Carga -->
  <div class="upload-overlay" id="uploadOverlay">
    <div class="loader-box">
      <i class="fa-solid fa-spinner fa-spin fa-3x" style="color: var(--accent-color);"></i>
      <p style="margin-top: 15px; font-size: 1.1rem;">Enviando tu proyecto...</p>
      <div class="progress-text" id="uploadProgressText">0%</div>
    </div>
  </div>

  <div class="container" id="mainContainer">
    <header>
      <h1>Ediciones Belikones</h1>
      <p>Convocatoria & Recepción de Manuscritos</p>
    </header>

    <!-- Buscador Integrado -->
    <section class="search-section">
      <form id="searchForm" class="search-box">
        <input type="text" id="searchInput" placeholder="Buscar en la página..." />
        <button type="submit" class="search-btn"><i class="fa-solid fa-magnifying-glass"></i></button>
      </form>
      <div class="search-controls" id="searchNavControls">
        <button type="button" class="search-nav-btn" id="prevMatchBtn"><i class="fa-solid fa-chevron-up"></i></button>
        <button type="button" class="search-nav-btn" id="nextMatchBtn"><i class="fa-solid fa-chevron-down"></i></button>
        <span id="searchCounter">0/0</span>
      </div>
      <div id="searchMessage" style="font-size: 0.85rem; margin-top: 5px;"></div>
    </section>

    <!-- Formulario de Manuscritos -->
    <div class="form-section">
      <form id="manuscriptForm" action="https://formspree.io/f/edicionesbelikones@gmail.com" method="POST" enctype="multipart/form-data">
        
        <div class="form-group">
          <label for="author">Nombre completo / Seudónimo *</label>
          <input type="text" id="author" name="Nombre del Autor" placeholder="Tu nombre o seudónimo literario" required>
        </div>

        <div class="form-group">
          <label for="email">Correo electrónico de contacto *</label>
          <input type="email" id="email" name="Correo" placeholder="tu-correo@ejemplo.com" autocomplete="email" required>
        </div>

        <div class="form-group">
          <label for="title">Título del proyecto / manuscrito *</label>
          <input type="text" id="title" name="Título del proyecto" placeholder="Título de la obra o proyecto" required>
        </div>

        <div class="form-group">
          <label for="type">Tipo de proyecto *</label>
          <select id="type" name="Tipo de proyecto" required>
            <option value="" disabled selected>Selecciona una opción</option>
            <option value="Narrativa">Narrativa (cuento, novela, etc.)</option>
            <option value="Poesía">Poesía</option>
            <option value="Ensayo">Ensayo / Crítica</option>
            <option value="Visual">Proyecto visual / Ilustración</option>
            <option value="Sonoro">Proyecto sonoro / Audio</option>
            <option value="Multiformato">Multiformato / Híbrido</option>
            <option value="IA">Asistido o generado con IA</option>
            <option value="Otro">Otro</option>
          </select>
        </div>

        <div class="form-group">
          <label for="description">Descripción o sinopsis del proyecto *</label>
          <textarea id="description" name="Descripción / Sinopsis" rows="6" placeholder="Cuéntanos brevemente de qué trata tu proyecto, su extensión aproximada y cualquier detalle relevante..." required></textarea>
        </div>

        <!-- Subida de manuscritos -->
        <div class="form-group">
          <label for="manuscript">Subir manuscrito / archivos *</label>
          <input type="file" id="manuscript" name="Archivo(s)" multiple accept=".pdf,.doc,.docx,.txt,.epub,.zip,.jpg,.jpeg,.png,.mp3,.mp4,.wav" required>
          <small>Puedes subir varios archivos (PDF, Word, ZIP, imágenes, audio o video). Tamaño máximo recomendado: 20 MB por archivo.</small>
        </div>

        <div class="form-group">
          <label for="notes">Notas adicionales (opcional)</label>
          <textarea id="notes" name="Notas adicionales" rows="3" placeholder="Cualquier información extra que quieras compartir con el equipo editorial..."></textarea>
        </div>

        <button type="submit" class="submit-btn">
          <i class="fa-solid fa-paper-plane"></i> Enviar proyecto
        </button>
      </form>
    </div>

    <footer>
      <p>© 2026 Ediciones Belikones. Todos los derechos reservados.</p>
    </footer>
  </div>

  <script>
    // ========== MENÚ MÓVIL ==========
    const navToggle = document.getElementById('navToggle');
    const navMenu = document.getElementById('navMenu');

    if (navToggle && navMenu) {
      navToggle.addEventListener('click', () => {
        const isOpen = navMenu.classList.toggle('active');
        navToggle.setAttribute('aria-expanded', isOpen);
      });
    }

    // ========== BUSCADOR CON RESALTADO ==========
    (function () {
      const searchInput = document.getElementById('searchInput');
      const searchForm = document.getElementById('searchForm');
      const searchMessage = document.getElementById('searchMessage');
      const searchNavControls = document.getElementById('searchNavControls');
      const searchCounter = document.getElementById('searchCounter');
      const prevBtn = document.getElementById('prevMatchBtn');
      const nextBtn = document.getElementById('nextMatchBtn');
      const mainContainer = document.getElementById('mainContainer');

      let matches = [];
      let currentIndex = -1;

      function isSkippable(node) {
        const parent = node.parentNode;
        if (!parent) return true;
        const tag = parent.tagName ? parent.tagName.toLowerCase() : '';
        return ['script', 'style', 'noscript', 'textarea', 'input', 'button', 'select'].includes(tag) ||
               parent.classList.contains('highlight-yellow');
      }

      function clearHighlights() {
        const highlights = document.querySelectorAll('.highlight-yellow');
        highlights.forEach(span => {
          const parent = span.parentNode;
          parent.replaceChild(document.createTextNode(span.textContent), span);
          parent.normalize();
        });
        matches = [];
        currentIndex = -1;
        searchNavControls.classList.remove('active');
        searchCounter.textContent = '0/0';
        searchMessage.textContent = '';
        searchMessage.classList.remove('no-results-glow');
        searchInput.classList.remove('no-results-glow');
      }

      function highlightMatches(term) {
        clearHighlights();
        if (!term || term.length < 2) return;

        const walker = document.createTreeWalker(
          mainContainer,
          NodeFilter.SHOW_TEXT,
          {
            acceptNode: function (node) {
              if (isSkippable(node) || !node.nodeValue.trim()) {
                return NodeFilter.FILTER_REJECT;
              }
              return NodeFilter.FILTER_ACCEPT;
            }
          }
        );

        const textNodes = [];
        let node;
        while ((node = walker.nextNode())) {
          textNodes.push(node);
        }

        const regex = new RegExp(term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');

        textNodes.forEach(textNode => {
          const text = textNode.nodeValue;
          if (!regex.test(text)) return;

          const frag = document.createDocumentFragment();
          let lastIndex = 0;
          let match;

          regex.lastIndex = 0;
          while ((match = regex.exec(text)) !== null) {
            if (match.index > lastIndex) {
              frag.appendChild(document.createTextNode(text.slice(lastIndex, match.index)));
            }

            const span = document.createElement('span');
            span.className = 'highlight-yellow';
            span.textContent = match[0];
            frag.appendChild(span);
            matches.push(span);

            lastIndex = regex.lastIndex;
          }

          if (lastIndex < text.length) {
            frag.appendChild(document.createTextNode(text.slice(lastIndex)));
          }

          textNode.parentNode.replaceChild(frag, textNode);
        });

        if (matches.length > 0) {
          currentIndex = 0;
          updateActiveMatch();
          searchNavControls.classList.add('active');
          searchCounter.textContent = `1/${matches.length}`;
          searchMessage.textContent = '';
          searchMessage.classList.remove('no-results-glow');
          searchInput.classList.remove('no-results-glow');
        } else {
          searchMessage.textContent = 'No hay resultados';
          searchMessage.style.color = '#ff0055';
          searchMessage.classList.add('no-results-glow');
          searchInput.classList.add('no-results-glow');
          searchNavControls.classList.remove('active');
        }
      }

      function updateActiveMatch() {
        matches.forEach((m, i) => {
          m.classList.toggle('active-match', i === currentIndex);
        });
        if (matches[currentIndex]) {
          matches[currentIndex].scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
        searchCounter.textContent = `${currentIndex + 1}/${matches.length}`;
      }

      function goToNext() {
        if (matches.length === 0) return;
        currentIndex = (currentIndex + 1) % matches.length;
        updateActiveMatch();
      }

      function goToPrev() {
        if (matches.length === 0) return;
        currentIndex = (currentIndex - 1 + matches.length) % matches.length;
        updateActiveMatch();
      }

      searchForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const term = searchInput.value.trim();
        highlightMatches(term);
      });

      let debounceTimer;
      searchInput.addEventListener('input', () => {
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(() => {
          const term = searchInput.value.trim();
          if (term.length >= 2) {
            highlightMatches(term);
          } else {
            clearHighlights();
          }
        }, 300);
      });

      nextBtn.addEventListener('click', goToNext);
      prevBtn.addEventListener('click', goToPrev);

      searchInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          highlightMatches(searchInput.value.trim());
        }
        if (e.key === 'ArrowDown' || e.key === 'ArrowRight') {
          e.preventDefault();
          goToNext();
        }
        if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') {
          e.preventDefault();
          goToPrev();
        }
      });
    })();

    // ========== LOADER DE SUBIDA CON BALA AK-47 ==========
    (function () {
      const form = document.getElementById('manuscriptForm');
      const overlay = document.getElementById('uploadOverlay');
      const progressText = document.getElementById('uploadProgressText');

      if (!form || !overlay) return;

      form.addEventListener('submit', function (e) {
        e.preventDefault();

        // Validación básica
        if (!form.checkValidity()) {
          form.reportValidity();
          return;
        }

        // Mostrar overlay
        overlay.classList.add('active');
        progressText.textContent = '0%';

        const formData = new FormData(form);
        const xhr = new XMLHttpRequest();

        xhr.open('POST', form.action, true);

        // Progreso de subida real
        xhr.upload.onprogress = function (event) {
          if (event.lengthComputable) {
            const percent = Math.round((event.loaded / event.total) * 100);
            progressText.textContent = percent + '%';
          }
        };

        xhr.onload = function () {
          if (xhr.status >= 200 && xhr.status < 300) {
            progressText.textContent = '100%';
            // Redirigir a la página de gracias
            setTimeout(() => {
              window.location.href = 'https://edicionesbelikones.github.io/Editorial-Belikones/gracias.html';
            }, 600);
          } else {
            // Si falla, ocultar y mostrar error
            overlay.classList.remove('active');
            alert('Hubo un problema al enviar el formulario. Intenta de nuevo.');
          }
        };

        xhr.onerror = function () {
          overlay.classList.remove('active');
          alert('Error de conexión. Verifica tu internet e intenta nuevamente.');
        };

        xhr.send(formData);
      });
    })();
  </script>
</body>
</html>
